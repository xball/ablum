{% extends "templates/web.html" %}

{% block page_content %}
<style>
	.ablum-toolbar, .ablum-people { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
	.ablum-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
	.ablum-tile, .ablum-detail { border: 1px solid #e5e7eb; background: #fff; border-radius: 8px; }
	.ablum-tile { padding: 0; }
	.ablum-tile img { width: 100%; height: 140px; object-fit: cover; display: block; }
	.ablum-detail { display: flex; gap: 12px; width: 100%; text-align: left; padding: 8px; margin-bottom: 8px; }
	.ablum-detail img { width: 72px; height: 72px; object-fit: cover; }
	.ablum-detail span { display: flex; flex-direction: column; }
	.ablum-public-map { height: 420px; margin-top: 16px; }
	.ablum-preview { max-width: 100%; max-height: 70vh; }
	#ablum-dialog { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); align-items: center; justify-content: center; }
	#ablum-dialog.open { display: flex; }
	#ablum-dialog figure { background: #fff; padding: 12px; border-radius: 8px; max-width: 90vw; }
</style>
<div id="ablum-public"></div>
<div id="ablum-dialog"><figure></figure></div>
<script src="/assets/frappe/js/lib/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="/assets/frappe/js/lib/leaflet/leaflet.css">
<script>
(function () {
	const album = {{ album_json | safe }};
	const root = document.getElementById("ablum-public");
	if (!album) {
		root.textContent = "This album is not available.";
		return;
	}
	let mode = "thumbnails";
	const title = document.createElement("h1");
	title.textContent = album.title || "Album";
	root.appendChild(title);
	if (album.description) {
		const description = document.createElement("p");
		description.textContent = album.description;
		root.appendChild(description);
	}
	const bar = document.createElement("div");
	bar.className = "ablum-toolbar";
	root.appendChild(bar);
	const list = document.createElement("div");
	root.appendChild(list);
	const map = document.createElement("div");
	map.className = "ablum-public-map";
	root.appendChild(map);
	function button(label, active, on_click) {
		const element = document.createElement("button");
		element.type = "button";
		element.textContent = label;
		element.onclick = on_click;
		bar.appendChild(element);
		return element;
	}
	function draw_list() {
		bar.replaceChildren();
		button("Thumbnails", mode === "thumbnails", () => { mode = "thumbnails"; draw_list(); });
		button("Details", mode === "details", () => { mode = "details"; draw_list(); });
		list.replaceChildren();
		(album.photos || []).forEach((photo) => {
			const row = document.createElement("button");
			row.type = "button";
			row.className = mode === "details" ? "ablum-detail" : "ablum-tile";
			const image = document.createElement("img");
			image.alt = "";
			image.src = photo.image || "";
			row.appendChild(image);
			if (mode === "details") {
				const text = document.createElement("span");
				[photo.caption || "No caption", photo.taken_on || "", (photo.people || []).join(", "),
					photo.latitude == null ? "No location" : Number(photo.latitude).toFixed(5) + ", " + Number(photo.longitude).toFixed(5)
				].forEach((line) => {
					const part = document.createElement("span");
					part.textContent = line;
					text.appendChild(part);
				});
				row.appendChild(text);
			}
			row.onclick = () => open_photo(photo);
			if (mode === "thumbnails" && !list.querySelector(".ablum-grid")) {
				const grid = document.createElement("div");
				grid.className = "ablum-grid";
				list.appendChild(grid);
			}
			(mode === "thumbnails" ? list.querySelector(".ablum-grid") : list).appendChild(row);
		});
	}
	function open_photo(photo) {
		const dialog = document.getElementById("ablum-dialog");
		const figure = dialog.querySelector("figure");
		figure.replaceChildren();
		const image = document.createElement("img");
		image.className = "ablum-preview";
		image.alt = "";
		image.src = photo.image || "";
		const caption = document.createElement("figcaption");
		caption.textContent = [photo.caption, photo.taken_on, (photo.people || []).join(", ")].filter(Boolean).join(" · ");
		figure.appendChild(image);
		figure.appendChild(caption);
		dialog.classList.add("open");
		dialog.onclick = (event) => {
			if (event.target === dialog) {
				dialog.classList.remove("open");
			}
		};
	}
	draw_list();
	if (window.L && (album.map || []).length) {
		const leaflet = L.map(map).setView([20, 0], 2);
		L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
			maxZoom: 19,
			attribution: "&copy; OpenStreetMap"
		}).addTo(leaflet);
		const markers = album.map.map((photo) => {
			const marker = L.circleMarker([Number(photo.latitude), Number(photo.longitude)], {
				radius: 8, color: "#2563eb", fillColor: "#2563eb", fillOpacity: 0.9
			}).addTo(leaflet);
			marker.on("click", () => open_photo(photo));
			return marker;
		});
		leaflet.fitBounds(L.featureGroup(markers).getBounds().pad(0.3));
	} else {
		map.remove();
	}
})();
</script>
{% endblock %}
